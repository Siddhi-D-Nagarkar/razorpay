spring:
  application:
    name: RazorPay_Clone
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/razorpaydb}
    username: ${DB_USERNAME:sdn}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:4600}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers:
      - ${KAFKA_BROKERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false
    consumer:
      group-id: razorpay-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "org.sdn.razorpay_clone.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap

vault:
  master-key: 8pDBThdCBclcEd3wrM3r1Si5qXDVtCbi6vrt0AsdYeo=

payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: FAILURE
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NETBANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80


jwt:
  secret-key: asdf97asd9fuajsiodfua98s7dfyuajsildfhao8s7dfuoaisjfdioas98df7yua8s

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 2
  kafka:
    topics:
      payment: payments.events
      order: orders.events
      refund: refund.events
      settlement: settlement.events

logging:
  level:
    org.hibernate.SQL: DEBUG

