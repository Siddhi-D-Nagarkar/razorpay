spring:
  application:
    name: RazorPay_Clone
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorpaydb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:4600}
      password: ${REDIS_PASSWORD:}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

vault:
  master-key: 8pDBThdCBclcEd3wrM3r1Si5qXDVtCbi6vrt0AsdYeo=

payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: FAILURE
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NETBANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80


jwt:
  secret-key: asdf97asd9fuajsiodfua98s7dfyuajsildfhao8s7dfuoaisjfdioas98df7yua8s

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 2